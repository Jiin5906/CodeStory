server {
    listen 80;
    server_name logam.click;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name logam.click;

    ssl_certificate /etc/letsencrypt/live/logam.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logam.click/privkey.pem;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. 메인 API 및 페이지 처리
    location / {
        # 👇 [정답] 서비스 이름인 'backend'를 사용
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_pass_header Content-Type;
        proxy_hide_header X-Powered-By;
    }

    # 2. PWA 필수: sw.js / manifest는 캐시하지 않음
    location ~* (sw\.js|manifest\.webmanifest)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # 3. 정적 리소스 (CSS, JS 등) 처리
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 👇 [수정함!] 여기도 똑같이 'backend'로 통일해야 합니다!
        proxy_pass http://backend:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_pass_header Content-Type;
        proxy_hide_header X-Powered-By;

        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}